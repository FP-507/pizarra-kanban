# Blueprint de Render: en el panel, "New > Blueprint" y elegir este repositorio.
# Plan gratuito: el servicio se duerme tras 15 min sin uso (el primer pedido tarda ~1 min)
# y su disco no es persistente, así que el tablero de demo vuelve a su estado inicial.
# Render admite WebSocket sin configuración extra.
services:
  - type: web
    name: pizarra-kanban
    runtime: docker
    plan: free
    healthCheckPath: /api/tableros/equipo-demo
    autoDeploy: true
    envVars:
      - key: SEMBRAR_DEMO
        value: "1"
